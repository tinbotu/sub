name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MeCab
        run: sudo apt-get update && sudo apt-get install -y libmecab-dev mecab mecab-ipadic-utf8

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unidic download

      - name: Lint
        run: flake8 sun.py subculture tests.py

      - name: Make sun.cgi executable
        run: chmod 755 sun.cgi

      - name: Run tests
        run: python tests.py
